[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cite-analyser"
version = "0.2.2"
description = "Citation extraction, reference verification, and in-text cross-checking — the Python successor to the cite-sight engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "regex>=2024.11",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "lens-contract>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
cite-analyser = "cite_analyser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cite_analyser"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "Dockerfile"]
exclude = ["/venv", "/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# macOS AppleDouble sidecars appear on some external volumes; they are not source.
extend-exclude = ["**/._*", "venv"]
